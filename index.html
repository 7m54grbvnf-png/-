<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a6cf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Учёт заработка</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --primary: #4a6cf7;
    --primary-soft: #eef2ff;
    --success: #10b981;
    --success-soft: #d1fae5;
    --warning: #f59e0b;
    --warning-soft: #fef3c7;
    --danger: #ef4444;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
    --shadow-md: 0 4px 12px rgba(15,23,42,.08);
    --shadow-lg: 0 10px 30px rgba(15,23,42,.12);
    --radius: 16px;
    --radius-sm: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020;
      --surface: #151b2e;
      --surface-2: #1a2138;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --primary: #6b8cff;
      --primary-soft: #1e2749;
      --success: #34d399;
      --success-soft: #064e3b;
      --warning: #fbbf24;
      --warning-soft: #78350f;
      --border: #273049;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    padding-bottom: 180px;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ============ HEADER ============ */
  .app-header {
    background: linear-gradient(135deg, var(--primary) 0%, #7c5cff 100%);
    color: #fff;
    padding: 18px 16px 14px;
    padding-top: calc(18px + env(safe-area-inset-top));
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 4px 20px rgba(74,108,247,.25);
  }
  .app-header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-actions {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }
  .header-actions button {
    flex: 1;
    padding: 10px 8px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,.15);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    transition: background .15s, transform .1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .header-actions button:active {
    background: rgba(255,255,255,.3);
    transform: scale(.97);
  }

  /* ============ TABS ============ */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 15;
    padding: 0 8px;
  }
  .tabs button {
    flex: 1;
    padding: 14px 4px;
    border: none;
    background: none;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
    position: relative;
  }
  .tabs button.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  .tabs button .badge {
    display: inline-block;
    margin-left: 5px;
    padding: 1px 6px;
    background: var(--primary-soft);
    color: var(--primary);
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    vertical-align: middle;
  }

  /* ============ HERO CARD (главный итог) ============ */
  .hero {
    margin: 14px 12px 8px;
    border-radius: var(--radius);
    background: var(--surface);
    padding: 20px;
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -40%;
    right: -20%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, var(--primary-soft) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .hero-amount {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--success);
    line-height: 1.1;
  }
  .hero-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .hero-grid .item .lbl {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .3px;
    margin-bottom: 3px;
  }
  .hero-grid .item .val {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  /* ============ PROGRESS BAR (прогресс до след. порога) ============ */
  .progress-card {
    margin: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  .progress-head {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 8px;
  }
  .progress-head .left { color: var(--text-muted); }
  .progress-head .right { font-weight: 700; color: var(--primary); }
  .progress-track {
    height: 8px;
    background: var(--surface-2);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), #7c5cff);
    border-radius: 4px;
    transition: width .4s ease;
  }
  .progress-note {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }
  .progress-note b { color: var(--text); }

  /* ============ SEARCH ============ */
  .search-wrap {
    margin: 12px 12px 6px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 11px 14px 11px 38px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .search-wrap::before {
    content: '🔍';
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: .5;
  }

  /* ============ ROW ITEM ============ */
  .list-wrap { padding: 6px 0; }
  .row {
    background: var(--surface);
    border-radius: var(--radius-sm);
    margin: 6px 12px;
    padding: 14px;
    box-shadow: var(--shadow-sm);
    transition: transform .1s, box-shadow .15s;
    cursor: pointer;
  }
  .row:active {
    transform: scale(.985);
    box-shadow: var(--shadow-md);
  }
  .row-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .row-title {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    line-height: 1.35;
    word-break: break-word;
    flex: 1;
  }
  .row-sum {
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    white-space: nowrap;
  }
  .row-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
  }
  .row-meta .pill {
    display: inline-block;
    padding: 2px 8px;
    background: var(--surface-2);
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 600;
  }
  .row-bottom {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .row-bottom .share {
    font-size: 11px;
    color: var(--text-muted);
  }
  .row-bottom .net {
    font-size: 15px;
    font-weight: 700;
    color: var(--success);
  }
  .row-bottom .net-lbl {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 500;
  }

  /* ============ FAB ============ */
  .fab {
    position: fixed;
    right: 20px;
    bottom: 170px;
    width: 56px;
    height: 56px;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--primary), #7c5cff);
    color: #fff;
    border: none;
    font-size: 26px;
    font-weight: 300;
    box-shadow: 0 8px 24px rgba(74,108,247,.45);
    z-index: 25;
    transition: transform .1s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding-bottom: 3px;
  }
  .fab:active { transform: scale(.9); }

  /* ============ BOTTOM BAR ============ */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    box-shadow: 0 -4px 20px rgba(15,23,42,.08);
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 20;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .bottom-bar .cell {
    text-align: center;
  }
  .bottom-bar .cell .lbl {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 600;
  }
  .bottom-bar .cell .val {
    font-size: 16px;
    font-weight: 700;
    margin-top: 2px;
  }
  .bottom-bar .cell.gross .val { color: var(--text); }
  .bottom-bar .cell.net .val { color: var(--success); }
  .bottom-bar .full {
    grid-column: span 2;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    text-align: center;
  }
  .bottom-bar .full .lbl {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 600;
  }
  .bottom-bar .full .val {
    font-size: 22px;
    font-weight: 800;
    color: var(--success);
    margin-top: 2px;
    letter-spacing: -0.5px;
  }

  /* ============ EMPTY ============ */
  .empty {
    text-align: center;
    padding: 60px 30px;
    color: var(--text-light);
  }
  .empty .icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: .5;
  }
  .empty .title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .empty .desc {
    font-size: 13px;
    line-height: 1.5;
  }

  /* ============ MODAL ============ */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    animation: fadeIn .2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 22px 22px 0 0;
    padding: 8px 20px 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    animation: slideUp .25s cubic-bezier(.16,1,.3,1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    margin: 8px auto 16px;
  }
  .modal h2 {
    margin: 0 0 18px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .modal label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 5px;
    margin-top: 14px;
    font-weight: 600;
  }
  .modal input, .modal select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .modal-buttons {
    display: flex;
    gap: 8px;
    margin-top: 24px;
  }
  .modal-buttons button {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    transition: transform .1s, opacity .15s;
  }
  .modal-buttons button:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; flex: 0 0 auto; padding-left: 18px; padding-right: 18px; }
  .btn-secondary { background: var(--surface-2); color: var(--text); }

  /* ============ SUMMARY TAB ============ */
  .summary-section {
    background: var(--surface);
    border-radius: var(--radius);
    margin: 12px;
    padding: 18px;
    box-shadow: var(--shadow-sm);
  }
  .summary-section h3 {
    margin: 0 0 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .summary-section table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .summary-section td {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
  }
  .summary-section td:last-child {
    text-align: right;
    font-weight: 700;
    color: var(--text);
  }
  .summary-section tr:last-child td { border-bottom: none; }
  .summary-section .grand {
    padding-top: 14px;
    margin-top: 10px;
    border-top: 2px solid var(--primary);
  }
  .summary-section .grand td {
    font-size: 16px;
    font-weight: 800;
    color: var(--success);
    padding-top: 14px;
  }

  /* ============ ANIMATIONS ============ */
  .fade-in { animation: fadeInUp .3s ease; }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>💰 Учёт заработка</h1>
  <div class="header-actions">
    <button onclick="loadExcel()">📂 Открыть</button>
    <button onclick="saveExcel()">💾 Excel</button>
    <button onclick="backupJSON()">⬇ Резерв</button>
    <button onclick="menuMore()">⋯ Ещё</button>
  </div>
</header>

<div class="tabs">
  <button id="tabSales" onclick="setTab('sales')">💵 Продажи <span class="badge" id="badgeSales">0</span></button>
  <button id="tabHours" onclick="setTab('hours')">⏱ Часы <span class="badge" id="badgeHours">0</span></button>
  <button id="tabSummary" onclick="setTab('summary')">📊 Итого</button>
</div>

<div id="content"></div>

<button class="fab" id="fab" onclick="openEdit()">＋</button>

<div class="bottom-bar" id="bottomBar">
  <div class="cell gross">
    <div class="lbl">До вычета 13%</div>
    <div class="val" id="totalGross">0 ₽</div>
  </div>
  <div class="cell net">
    <div class="lbl">После вычета</div>
    <div class="val" id="totalNet">0 ₽</div>
  </div>
  <div class="full">
    <div class="lbl">На руки</div>
    <div class="val" id="grandTotal">0 ₽</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h2 id="modalTitle">Новая запись</h2>
    <div id="modalFields"></div>
    <div class="modal-buttons">
      <button class="btn-danger" id="btnDelete" onclick="deleteCurrent()" style="display:none">🗑</button>
      <button class="btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn-primary" onclick="saveRecord()">Сохранить</button>
    </div>
  </div>
</div>

<input type="file" id="fileInputExcel" accept=".xlsx,.xls" style="display:none">
<input type="file" id="fileInputJSON" accept=".json" style="display:none">

<script>
// ========================
//  КОНСТАНТЫ И ФОРМУЛЫ
// ========================
const HOURLY_RATE = 825;
const TAX = 0.13;

// Шкала продаж: до 300к → 0%, 300к–700к → 5%, от 700к → 10%
const SALES_TIERS = [
  { min: 0,      max: 300000,  percent: 0,  label: 'до 300 000' },
  { min: 300000, max: 700000,  percent: 5,  label: '300 000 – 700 000' },
  { min: 700000, max: Infinity, percent: 10, label: 'от 700 000' }
];

function salesPercentByTurnover(turnover) {
  for (const t of SALES_TIERS) {
    if (turnover >= t.min && turnover < t.max) return t.percent;
  }
  return 10;
}

// ========================
//  ДАННЫЕ
// ========================
let salesData = [];   // [{org, inn, kpp, sum, product}]
let hoursData = [];   // [{org, inn, kpp, stage, status, hours, link}]
let currentTab = 'sales';
let editIndex = null;
let editType = 'sales';
let searchQuery = '';

// ========================
//  УТИЛИТЫ
// ========================
function fmt(n) {
  return (Math.round(n * 100) / 100).toLocaleString('ru-RU', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
function fmtInt(n) {
  return Math.round(n).toLocaleString('ru-RU');
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:200px;left:50%;transform:translateX(-50%);
    background:rgba(15,23,42,.9);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13px;z-index:999;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);
    animation:fadeInUp .25s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ========================
//  ИТОГИ
// ========================
function getTotals() {
  // Продажи — вариант Б: общий оборот → один процент
  const salesTurnover = salesData.reduce((a, r) => a + (+r.sum || 0), 0);
  const salesPct = salesPercentByTurnover(salesTurnover);
  const salesGross = salesTurnover * (salesPct / 100);
  const salesNet = salesGross * (1 - TAX);

  // Часы
  const totalHours = hoursData.reduce((a, r) => a + (+r.hours || 0), 0);
  const hoursGross = totalHours * HOURLY_RATE;
  const hoursNet = hoursGross * (1 - TAX);

  return {
    salesTurnover, salesPct, salesGross, salesNet,
    totalHours, hoursGross, hoursNet,
    allGross: salesGross + hoursGross,
    allNet: salesNet + hoursNet
  };
}

// ========================
//  ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
// ========================
function setTab(t) {
  currentTab = t;
  searchQuery = '';
  document.getElementById('tabSales').classList.toggle('active', t === 'sales');
  document.getElementById('tabHours').classList.toggle('active', t === 'hours');
  document.getElementById('tabSummary').classList.toggle('active', t === 'summary');
  document.getElementById('fab').style.display = t === 'summary' ? 'none' : 'flex';
  render();
}

// ========================
//  ОТРИСОВКА
// ========================
function render() {
  renderBadges();
  renderBottomBar();
  const c = document.getElementById('content');

  if (currentTab === 'summary') {
    renderSummary(c);
  } else {
    renderList(c);
  }
}

function renderBadges() {
  document.getElementById('badgeSales').textContent = salesData.length;
  document.getElementById('badgeHours').textContent = hoursData.length;
}

function renderBottomBar() {
  const t = getTotals();
  if (currentTab === 'sales') {
    document.getElementById('totalGross').textContent = fmt(t.salesGross) + ' ₽';
    document.getElementById('totalNet').textContent = fmt(t.salesNet) + ' ₽';
    document.getElementById('grandTotal').textContent = fmt(t.salesNet) + ' ₽';
  } else if (currentTab === 'hours') {
    document.getElementById('totalGross').textContent = fmt(t.hoursGross) + ' ₽';
    document.getElementById('totalNet').textContent = fmt(t.hoursNet) + ' ₽';
    document.getElementById('grandTotal').textContent = fmt(t.hoursNet) + ' ₽';
  } else {
    document.getElementById('totalGross').textContent = fmt(t.allGross) + ' ₽';
    document.getElementById('totalNet').textContent = fmt(t.allNet) + ' ₽';

function renderSalesProgress(turnover) {
  // Определяем текущий порог и следующий
  let currentTier = SALES_TIERS[0];
  for (const t of SALES_TIERS) {
    if (turnover >= t.min && turnover < t.max) { currentTier = t; break; }
  }

  // Если уже на максимуме — показываем максимум
  if (currentTier.percent === 10) {
    return `
      <div class="progress-card">
        <div class="progress-head">
          <span class="left">Шкала продаж</span>
          <span class="right">10% — максимум 🎉</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
        <div class="progress-note">Достигнут максимальный процент</div>
      </div>
    `;
  }

  // Следующий порог
  const nextTier = SALES_TIERS.find(t => t.min > currentTier.min && t.percent > currentTier.percent);
  const nextThreshold = nextTier ? nextTier.min : currentTier.max;
  const needed = nextThreshold - turnover;
  const totalSpan = currentTier.max - currentTier.min;
  const done = turnover - currentTier.min;
  const percent = Math.max(0, Math.min(100, (done / totalSpan) * 100));

  return `
    <div class="progress-card">
      <div class="progress-head">
        <span class="left">Ваша ставка: <b>${currentTier.percent}%</b></span>
        <span class="right">${percent.toFixed(0)}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div>
      <div class="progress-note">
        До ставки <b>${nextTier.percent}%</b> осталось продать <b>${fmtInt(needed)} ₽</b>
      </div>
    </div>
  `;
}

function renderSalesRow(r, i, t) {

  const meta = [];

  if (r.product) meta.push(`<span class="pill">${escapeHtml(r.product)}</span>`);

  return `

      <div class="row-head">

        <div class="row-sum">${fmtInt(sum)} ₽</div>

  `;
}

function openEdit(idx = null, type = null) {
  editIndex = idx;
  editType = type || (currentTab === 'hours' ? 'hours' : 'sales');
  const fields = editType === 'sales' ? SALES_FIELDS : HOURS_FIELDS;
  const data = editType === 'sales' ? salesData : hoursData;
  const rec = idx !== null ? data[idx] : {};

  document.getElementById('modalTitle').textContent =
    (idx !== null ? 'Редактирование' : 'Новая запись') + ' · ' +
    (editType === 'sales' ? '💵 Продажа' : '⏱ Часы');

  document.getElementById('modalFields').innerHTML = fields.map(f => `
    <label>${f.label}${f.required ? ' *' : ''}</label>
    <input id="f_${f.key}" type="${f.type}"
           ${f.type === 'number' ? 'step="0.01" inputmode="decimal"' : ''}
           placeholder="${f.placeholder || ''}"
           value="${escapeHtml(rec[f.key] != null ? rec[f.key] : (f.type === 'number' ? '' : ''))}">
  `).join('');

  document.getElementById('btnDelete').style.display = idx !== null ? 'block' : 'none';
  document.getElementById('overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
}

function saveRecord() {
  const fields = editType === 'sales' ? SALES_FIELDS : HOURS_FIELDS;
  const data = editType === 'sales' ? salesData : hoursData;
  const rec = {};

  for (const f of fields) {
    let v = document.getElementById('f_' + f.key).value.trim();
    if (f.type === 'number') v = parseFloat(v.replace(',', '.')) || 0;
    if (f.required && !v) { toast('Заполните: ' + f.label); return; }
    rec[f.key] = v;
  }

  if (editIndex !== null) data[editIndex] = rec;
  else data.push(rec);

  persist();
  render();
  closeModal();
  toast(editIndex !== null ? 'Обновлено' : 'Добавлено');
}

function deleteCurrent() {
  if (editIndex === null) return;
  if (!confirm('Удалить эту запись?')) return;
  const data = editType === 'sales' ? salesData : hoursData;
  data.splice(editIndex, 1);
  persist();
  render();
  closeModal();
  toast('Удалено');
}

function backupJSON() {
  if (!salesData.length && !hoursData.length) {
    toast('Нет данных');
    return;
  }
  const blob = new Blob(
    [JSON.stringify({ salesData, hoursData, exported: new Date().toISOString() }, null, 2)],
    { type: 'application/json' }
  );
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('Резервная копия скачана');
}

function restoreJSON() {
  document.getElementById('fileInputJSON').click();
}

document.getElementById('fileInputJSON').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const obj = JSON.parse(evt.target.result);
      if (!obj.salesData && !obj.hoursData) throw new Error('Неверный формат');
      if (!confirm('Заменить текущие данные резервной копией?')) return;
      salesData = obj.salesData || [];
      hoursData = obj.hoursData || [];
      persist(); render();
      toast('Данные восстановлены');
    } catch (err) {
      alert('Ошибка: ' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

function loadExcel() { document.getElementById('fileInputExcel').click(); }

document.getElementById('fileInputExcel').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
      const newSales = [];
      const newHours = [];

      let salesSheetName = null, hoursSheetName = null;
      wb.SheetNames.forEach(name => {
        const n = name.toLowerCase();
        if (n.includes('подключ') || n.includes('продаж')) salesSheetName = name;
        else if (n.includes('час') || n.includes('внедрен')) hoursSheetName = name;
      });
      if (!salesSheetName && wb.SheetNames[0]) salesSheetName = wb.SheetNames[0];
      if (!hoursSheetName && wb.SheetNames[1]) hoursSheetName = wb.SheetNames[1];

      // --- Продажи ---
      if (salesSheetName) {
        const ws = wb.Sheets[salesSheetName];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        let headerRow = 0;
        for (let i = 0; i < rows.length; i++) {
          if (rows[i].some(v => String(v).trim())) { headerRow = i; break; }
        }
        const headers = rows[headerRow].map(h => String(h).toLowerCase());
        const colOrg = headers.findIndex(h => h.includes('организац') || h.includes('назван') || h.includes('клиент'));
        const colSum = headers.findIndex(h => h.includes('сумм') || h.includes('оплат'));
        const colProduct = headers.findIndex(h => h.includes('продукт'));

        for (let i = headerRow + 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || r.every(v => !String(v).trim())) continue;
          const org = colOrg >= 0 ? String(r[colOrg] || '').trim() : '';
          const sumStr = colSum >= 0 ? String(r[colSum] || '') : '';
          if (org.toLowerCase().includes('итого')) continue;
          if (!org && !sumStr) continue;

          let inn = '', kpp = '', orgClean = org;
          const m = org.match(/(.+?)\s+([\d]{10,12})-([\d]{9,11})\s*$/);
          if (m) { orgClean = m[1].trim(); inn = m[2]; kpp = m[3]; }
          else {
            const m2 = org.match(/(.+?)\s+([\d]{10,12})\s*$/);
            if (m2) { orgClean = m2[1].trim(); inn = m2[2]; }
          }

          const sum = parseFloat(String(sumStr).replace(/[^\d.,-]/g, '').replace(',', '.')) || 0;
          if (!orgClean) continue;
          newSales.push({
            org: orgClean, inn, kpp, sum,
            product: colProduct >= 0 ? String(r[colProduct] || '').trim() : ''
          });
        }
      }

      // --- Часы ---
      if (hoursSheetName) {
        const ws = wb.Sheets[hoursSheetName];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        let headerRow = 0;
        for (let i = 0; i < rows.length; i++) {
          if (rows[i].some(v => String(v).trim())) { headerRow = i; break; }
        }
        const headers = rows[headerRow].map(h => String(h).toLowerCase());
        const colOrg    = headers.findIndex(h => h.includes('организац') || h.includes('назван'));
        const colInn    = headers.findIndex(h => h === 'инн' || h.includes('инн'));
        const colKpp    = headers.findIndex(h => h.includes('кпп'));
        const colStage  = headers.findIndex(h => h.includes('этап'));
        const colStatus = headers.findIndex(h => h.includes('стади') || h.includes('внедрен'));
        const colHours  = headers.findIndex(h => h.includes('час'));
        const colLink   = headers.findIndex(h => h.includes('ссылк') || h.includes('ютрек') || h.includes('yt'));

        for (let i = headerRow + 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || r.every(v => !String(v).trim())) continue;
          const org = colOrg >= 0 ? String(r[colOrg] || '').trim() : '';
          if (!org || org.toLowerCase().includes('итого')) continue;
          const hoursVal = colHours >= 0 ? parseFloat(String(r[colHours] || '').replace(',', '.')) : 0;
          if (!hoursVal) continue;
          newHours.push({
            org,
            inn:    colInn    >= 0 ? String(r[colInn]    || '').trim() : '',
            kpp:    colKpp    >= 0 ? String(r[colKpp]    || '').trim() : '',
            stage:  colStage  >= 0 ? String(r[colStage]  || '').trim() : '',
            status: colStatus >= 0 ? String(r[colStatus] || '').trim() : '',
            hours:  hoursVal,
            link:   colLink   >= 0 ? String(r[colLink]   || '').trim() : ''
          });
        }
      }

      if (!newSales.length && !newHours.length) {
        alert('Не удалось распознать данные.');
        return;
      }

      const msg = `Найдено:\n• Продажи: ${newSales.length}\n• Часы: ${newHours.length}\n\nЗаменить текущие данные?`;
      if (!confirm(msg)) return;

      salesData = newSales;
      hoursData = newHours;
      persist(); render();
      toast('Загружено успешно');
    } catch (err) {
      alert('Ошибка чтения файла: ' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
});

function saveExcel() {

    toast('Нет данных для сохранения');

  }

  // Лист продаж

      'КПП': r.kpp || '',
      'Сумма оплаты': sum,
      'Продукт': r.product || '',
      'Вклад в оборот, %': t.salesTurnover > 0 ? Math.round(sum / t.salesTurnover * 10000) / 100 : 0,
      'Вклад в заработок до 13%': Math.round(contribution * 100) / 100,
      'Вклад в заработок после 13%': Math.round(net * 100) / 100
    };
  });
  salesRows.push({});
  salesRows.push({
    'Название организации': 'ИТОГО',
    'Сумма оплаты': t.salesTurnover,
    'Вклад в заработок до 13%': Math.round(t.salesGross * 100) / 100,
    'Вклад в заработок после 13%': Math.round(t.salesNet * 100) / 100
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salesRows), 'Подключения');

  // Лист часов
  const hoursRows = hoursData.map(r => {
    const h = +r.hours || 0;
    const gross = h * HOURLY_RATE;
    const net = gross * (1 - TAX);
    return {
      'Название организации': r.org,
      'ИНН': r.inn || '',
      'КПП': r.kpp || '',
      'Этап': r.stage || '',
      'Стадия внедрения': r.status || '',
      'Кол-во часов по ютреку': h,
      'Ссылка ютрек': r.link || '',
      'Заработок до 13%': Math.round(gross * 100) / 100,
      'Заработок после 13%': Math.round(net * 100) / 100
    };
  });
  hoursRows.push({});
  hoursRows.push({
    'Название организации': 'ИТОГО',
    'Кол-во часов по ютреку': t.totalHours,
    'Заработок до 13%': Math.round(t.hoursGross * 100) / 100,
    'Заработок после 13%': Math.round(t.hoursNet * 100) / 100
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hoursRows), 'Логистика часы внедрения');

  // Лист Итого
  const summaryRows = [
    { 'Показатель': 'Оборот продаж', 'Значение': t.salesTurnover },
    { 'Показатель': 'Процент с продаж', 'Значение': t.salesPct + '%' },
    { 'Показатель': 'Продажи — до 13%', 'Значение': Math.round(t.salesGross * 100) / 100 },
    { 'Показатель': 'Продажи — на руки', 'Значение': Math.round(t.salesNet * 100) / 100 },
    { 'Показатель': 'Всего часов', 'Значение': t.totalHours },
    { 'Показатель': 'Часы — до 13%', 'Значение': Math.round(t.hoursGross * 100) / 100 },
    { 'Показатель': 'Часы — на руки', 'Значение': Math.round(t.hoursNet * 100) / 100 },
    { 'Показатель': 'ОБЩИЙ ИТОГ до 13%', 'Значение': Math.round(t.allGross * 100) / 100 },
    { 'Показатель': 'ОБЩИЙ ИТОГ на руки', 'Значение': Math.round(t.allNet * 100) / 100 }
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), 'Итого');

  XLSX.writeFile(wb, 'заработок_' + new Date().toISOString().slice(0,10) + '.xlsx');
  toast('Excel сохранён');
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeModal();
});

// ========================
//  СТАРТ
// ========================
restore();
setTab('sales');
</script>
